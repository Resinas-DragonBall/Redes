<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resinas DragonBall - Redes Sociales</title>
  
  <!-- Fuente Bangers desde Google Fonts (Estilo Anime/Manga) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">

  <style>
    html {
      background-image: url('fondo.png?v=6');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-color: #000000; 
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent; 
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end; 
      min-height: 100vh;
      margin: 0;
      padding: 20px 20px 40px 20px; 
      box-sizing: border-box;
    }

    /* Recuadro enfocado solo en el título y subtítulo */
    .card {
      background: rgba(30, 30, 30, 0.85); 
      border: 1px solid #333;
      border-radius: 20px;
      padding: 20px 24px;
      text-align: center;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      backdrop-filter: blur(5px); 
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Bangers', cursive;
      font-size: 36px;
      margin: 0 0 4px 0;
      color: #FFB703;
      letter-spacing: 2px;
      text-transform: uppercase;
      -webkit-text-stroke: 1px #000000;
      text-shadow: 2px 2px 0px #E63946, 4px 4px 10px rgba(0,0,0,0.9);
    }

    p {
      font-size: 14px;
      color: #ccc;
      margin: 0;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    /* Contenedor de botones */
    .button-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      width: 100%;
      max-width: 360px;
    }

    /* Botones independientes */
    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 90px;
      height: 90px;
      border-radius: 18px;
      text-decoration: none;
      color: white;
      box-sizing: border-box;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      font-size: 11px;
      font-weight: 600;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      border: none;
      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(255,183,3,0.4);
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn img {
      width: 38px;
      height: 38px;
      margin-bottom: 6px;
      object-fit: contain;
    }

    .instagram {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }

    .tiktok {
      background-color: #000000;
      border: 1px solid #444;
    }

    .whatsapp {
      background-color: #25D366;
    }

    /* Estilos para el Pop-Up (Modal) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
      box-sizing: border-box;
    }

    .modal-content {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      max-width: 320px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
      animation: popupAnim 0.2s ease-out;
    }

    @keyframes popupAnim {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-content h2 {
      font-family: 'Bangers', cursive;
      font-size: 26px;
      color: #FFB703;
      margin: 0 0 10px 0;
      letter-spacing: 1px;
    }

    .modal-content p {
      font-size: 15px;
      color: #e0e0e0;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .modal-btn {
      display: inline-block;
      background-color: #25D366;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 15px;
      padding: 12px 20px;
      border-radius: 12px;
      margin-bottom: 10px;
      width: 100%;
      box-sizing: border-box;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: #888;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Recuadro solo con el nombre y subtítulo -->
  <div class="card">
    <h1>Resinas DragonBall</h1>
    <p>¡Síguenos en nuestras redes!</p>
  </div>

  <!-- Botones libres fuera del recuadro -->
  <div class="button-container">
    <a href="https://www.instagram.com/resinasdragonball" class="btn instagram" target="_blank">
      <img src="Instagram.png" alt="Instagram">
      Instagram
    </a>

    <a href="https://www.tiktok.com/@resinasdragonball" class="btn tiktok" target="_blank">
      <img src="TikTok.png" alt="TikTok">
      TikTok
    </a>

    <!-- Botón de WhatsApp abre el Pop-Up -->
    <button class="btn whatsapp" onclick="openModal()">
      <img src="WhatsApp.png" alt="WhatsApp">
      WhatsApp
    </button>
  </div>

  <!-- Estructura del Pop-Up -->
  <div class="modal-overlay" id="whatsappModal">
    <div class="modal-content">
      <h2>¡Contacto Directo!</h2>
      <p>Para realizar tu encargo/pedido personalizado contáctanos al <strong>633950766</strong></p>
      <a href="https://wa.me/34633950766" class="btn whatsapp modal-btn" target="_blank">
        Ir a WhatsApp
      </a>
      <button class="close-btn" onclick="closeModal()">Cerrar</button>
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById('whatsappModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('whatsappModal').style.display = 'none';
    }

    // Cerrar el modal al hacer clic fuera del contenido
    window.onclick = function(event) {
      const modal = document.getElementById('whatsappModal');
      if (event.target === modal) {
        closeModal();
      }
    }
  </script>

</body>
</html>
