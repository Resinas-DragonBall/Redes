<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resinas DragonBall - Redes Sociales</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #111111;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 30px 24px;
      text-align: center;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 22px;
      margin-bottom: 6px;
      color: #ff9900;
    }
    p {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 24px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      color: white;
      box-sizing: border-box;
      transition: transform 0.15s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .instagram {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }
    .tiktok {
      background-color: #000000;
      border: 1px solid #444;
    }
    .whatsapp {
      background-color: #25D366;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Resinas DragonBall</h1>
    <p>¡Elige donde quieres seguirnos!</p>

    <a href="https://www.instagram.com/resinasdragonball" class="btn instagram" target="_blank">
      📸 Instagram
    </a>

    <a href="https://www.tiktok.com/@resinasdragonball" class="btn tiktok" target="_blank">
      🎵 TikTok
    </a>

    <!-- Reemplaza el número de teléfono abajo por el tuyo con el prefijo de país (Ej: 34600000000) -->
    <a href="https://wa.me/34000000000" class="btn whatsapp" target="_blank">
      💬 WhatsApp
    </a>
  </div>
</body>
</html>
