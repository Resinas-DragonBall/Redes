<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resinas DragonBall - Redes Sociales</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111111; /* Fondo oscuro */
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1e1e1e; /* Fondo de la tarjeta */
      border: 1px solid #333;
      border-radius: 20px;
      padding: 30px 24px;
      text-align: center;
      width: 100%;
      max-width: 400px; /* Un poco más ancha para los botones en línea */
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 22px;
      margin-bottom: 6px;
      color: #ff9900; /* Color naranja DragonBall */
    }
    p {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 30px; /* Más espacio antes de los botones */
    }
    /* Contenedor para alinear los botones en línea */
    .button-container {
      display: flex;
      justify-content: center; /* Centra los botones horizontalmente */
      gap: 15px; /* Espacio entre los botones */
      flex-wrap: wrap; /* Permite que bajen si no caben en pantallas muy pequeñas */
    }
    .btn {
      display: flex;
      flex-direction: column; /* Icono arriba, texto abajo */
      align-items: center;
      justify-content: center;
      /* Botones cuadrados */
      width: 100px;
      height: 100px;
      border-radius: 15px; /* Bordes redondeados */
      text-decoration: none;
      color: white;
      box-sizing: border-box;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      font-size: 12px; /* Texto más pequeño */
      font-weight: 600;
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(255,153,0,0.3); /* Brillo al pasar el ratón */
    }
    .btn:active {
      transform: scale(0.95);
    }
    /* Tamaño y estilo de los iconos dentro de los botones */
    .btn img, .btn-icon {
      width: 40px;
      height: 40px;
      margin-bottom: 8px; /* Espacio con el texto */
      object-fit: contain;
    }
    .btn-icon {
        font-size: 40px;
        line-height: 40px;
    }
    /* Colores y estilos específicos para cada red social */
    .instagram {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }
    .tiktok {
      background-color: #000000;
      border: 1px solid #444;
    }
    .whatsapp {
      background-color: #25D366;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Resinas DragonBall</h1>
    <p>¡Síguenos en nuestras redes!</p>

    <div class="button-container">
      <!-- Botón de Instagram usando tu imagen -->
      <a href="https://www.instagram.com/resinasdragonball" class="btn instagram" target="_blank">
        <img src="Instagram.png" alt="Instagram">
        Instagram
      </a>

      <!-- Botón de TikTok usando tu imagen -->
      <a href="https://www.tiktok.com/@resinasdragonball" class="btn tiktok" target="_blank">
        <img src="TikTok.png" alt="TikTok">
        TikTok
      </a>

      <!-- Botón de WhatsApp usando un emoji -->
      <!-- Recuerda cambiar '34000000000' por tu número real con prefijo -->
      <a href="https://wa.me/34000000000" class="btn whatsapp" target="_blank">
        <span class="btn-icon">💬</span>
        WhatsApp
      </a>
    </div>
  </div>
</body>
</html>
