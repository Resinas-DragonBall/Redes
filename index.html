<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resinas DragonBall - Redes Sociales</title>
  
  <!-- Tipografía de Dragon Ball -->
  <link href="https://fonts.cdnfonts.com/css/saiyan-sans" rel="stylesheet">

  <style>
    html {
      background-image: url('fondo.png?v=2');
      background-size: contain; /* Ajusta la imagen al formato móvil sin estirar */
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-color: #000000; 
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent; 
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background: rgba(30, 30, 30, 0.85); 
      border: 1px solid #333;
      border-radius: 20px;
      padding: 30px 24px;
      text-align: center;
      width: 100%;
      max-width: 360px; /* Tamaño optimizado para móvil */
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      backdrop-filter: blur(5px); 
    }

    h1 {
      font-family: 'Saiyan Sans', sans-serif;
      font-size: 34px;
      margin-bottom: 6px;
      color: #FFCC00;
      text-transform: uppercase;
      letter-spacing: 2px;
      -webkit-text-stroke: 1.5px #000000;
      text-shadow: 3px 3px 0px #FF0000, 5px 5px 10px rgba(0,0,0,0.8);
    }

    p {
      font-size: 14px;
      color: #ccc;
      margin-bottom: 25px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    .button-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 90px;
      height: 90px;
      border-radius: 15px;
      text-decoration: none;
      color: white;
      box-sizing: border-box;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      font-size: 11px;
      font-weight: 600;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(255,153,0,0.5);
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn img {
      width: 36px;
      height: 36px;
      margin-bottom: 6px;
      object-fit: contain;
    }

    .instagram {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }

    .tiktok {
      background-color: #000000;
      border: 1px solid #444;
    }

    .whatsapp {
      background-color: #25D366;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Resinas DragonBall</h1>
    <p>¡Síguenos en nuestras redes!</p>

    <div class="button-container">
      <a href="https://www.instagram.com/resinasdragonball" class="btn instagram" target="_blank">
        <img src="Instagram.png" alt="Instagram">
        Instagram
      </a>

      <a href="https://www.tiktok.com/@resinasdragonball" class="btn tiktok" target="_blank">
        <img src="TikTok.png" alt="TikTok">
        TikTok
      </a>

      <a href="https://wa.me/34000000000" class="btn whatsapp" target="_blank">
        <img src="WhatsApp.png" alt="WhatsApp">
        WhatsApp
      </a>
    </div>
  </div>
</body>
</html>
