<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resinas DragonBall / Pokemanía3D</title>
  
  <!-- Fuente Bangers desde Google Fonts (Estilo Anime/Manga) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">

  <style>
    html {
      background-image: url('fondo.png?v=10');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-color: #000000; 
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent; 
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end; 
      min-height: 100vh;
      margin: 0;
      padding: 20px 20px 40px 20px; 
      box-sizing: border-box;
    }

    /* Pestañas superiores (Dragon Ball / Pokemanía3D) */
    .tabs-container {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      width: 100%;
      max-width: 360px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 14px;
      border-radius: 12px;
      font-family: 'Bangers', cursive;
      font-size: 18px;
      letter-spacing: 1px;
      text-align: center;
      cursor: pointer;
      border: none;
      transition: transform 0.15s ease, background-color 0.15s ease, color 0.15s ease;
      box-sizing: border-box;
    }

    .tab-active {
      background-color: #FFB703;
      color: #000000;
      border: 2px solid #FFB703;
      box-shadow: 0 4px 10px rgba(255, 183, 3, 0.4);
    }

    .tab-inactive {
      background: rgba(30, 30, 30, 0.85);
      color: #cccccc;
      border: 1px solid #444;
      backdrop-filter: blur(5px);
    }

    .tab-btn:hover {
      transform: translateY(-2px);
    }

    /* Recuadro solo con el nombre y subtítulo */
    .card {
      background: rgba(30, 30, 30, 0.85); 
      border: 1px solid #FFB703;
      border-radius: 20px;
      padding: 20px 24px;
      text-align: center;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      backdrop-filter: blur(5px); 
      margin-bottom: 20px;
      box-sizing: border-box;
    }

    h1 {
      font-family: 'Bangers', cursive;
      font-size: 36px;
      margin: 0 0 4px 0;
      color: #FFB703;
      letter-spacing: 2px;
      text-transform: uppercase;
      -webkit-text-stroke: 1px #000000;
      text-shadow: 2px 2px 0px #E63946, 4px 4px 10px rgba(0,0,0,0.9);
    }

    p {
      font-size: 14px;
      color: #ccc;
      margin: 0;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    /* Contenedor de botones fuera del recuadro */
    .button-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      width: 100%;
      max-width: 360px;
    }

    /* Botones independientes */
    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 90px;
      height: 90px;
      border-radius: 18px;
      text-decoration: none;
      color: white;
      box-sizing: border-box;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      font-size: 11px;
      font-weight: 600;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    }

    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(255,183,3,0.4);
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn img {
      width: 38px;
      height: 38px;
      margin-bottom: 6px;
      object-fit: contain;
    }

    .instagram {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }

    .tiktok {
      background-color: #000000;
      border: 1px solid #444;
    }

    .whatsapp {
      background-color: #25D366;
    }
  </style>
</head>
<body>

  <!-- Pestañas para cambiar la sección -->
  <div class="tabs-container">
    <button id="tab-db" class="tab-btn tab-active" onclick="switchTab('db')">DRAGON BALL</button>
    <button id="tab-pm" class="tab-btn tab-inactive" onclick="switchTab('pm')">POKEMANÍA3D</button>
  </div>

  <!-- Recuadro dinámico con el título -->
  <div class="card">
    <h1 id="main-title">Resinas DragonBall</h1>
    <p id="main-subtitle">¡Síguenos en nuestras redes!</p>
  </div>

  <!-- Botones independientes con enlaces dinámicos -->
  <div class="button-container">
    <a id="link-instagram" href="https://www.instagram.com/resinasdragonball" class="btn instagram" target="_blank">
      <img src="Instagram.png" alt="Instagram">
      Instagram
    </a>

    <a id="link-tiktok" href="https://www.tiktok.com/@resinasdragonball" class="btn tiktok" target="_blank">
      <img src="TikTok.png" alt="TikTok">
      TikTok
    </a>

    <a id="link-whatsapp" href="https://wa.me/34633950766" class="btn whatsapp" target="_blank">
      <img src="WhatsApp.png" alt="WhatsApp">
      WhatsApp
    </a>
  </div>

  <script>
    // Datos de cada pestaña
    const data = {
      db: {
        title: "Resinas DragonBall",
        subtitle: "¡Síguenos en nuestras redes!",
        instagram: "https://www.instagram.com/resinasdragonball",
        tiktok: "https://www.tiktok.com/@resinasdragonball",
        whatsapp: "https://wa.me/34633950766"
      },
      pm: {
        title: "Pokemanía 3D",
        subtitle: "¡Impresiones e icónicos de Pokémon!",
        instagram: "https://www.instagram.com/tu_cuenta_pokemania", // Cambia por tu Instagram de Pokemanía
        tiktok: "https://www.tiktok.com/@tu_cuenta_pokemania",    // Cambia por tu TikTok de Pokemanía
        whatsapp: "https://wa.me/34633950766"
      }
    };

    function switchTab(section) {
      const tabDB = document.getElementById('tab-db');
      const tabPM = document.getElementById('tab-pm');

      if (section === 'db') {
        tabDB.className = 'tab-btn tab-active';
        tabPM.className = 'tab-btn tab-inactive';
      } else {
        tabPM.className = 'tab-btn tab-active';
        tabDB.className = 'tab-btn tab-inactive';
      }

      // Actualizar textos y enlaces sin salir de index.html
      document.getElementById('main-title').innerText = data[section].title;
      document.getElementById('main-subtitle').innerText = data[section].subtitle;
      document.getElementById('link-instagram').href = data[section].instagram;
      document.getElementById('link-tiktok').href = data[section].tiktok;
      document.getElementById('link-whatsapp').href = data[section].whatsapp;
    }
  </script>

</body>
</html>
