<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resinas DragonBall - Redes Sociales</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111111;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 30px 24px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 22px;
      margin-bottom: 6px;
      color: #ff9900;
    }
    p {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 30px;
    }
    .button-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100px;
      height: 100px;
      border-radius: 15px;
      text-decoration: none;
      color: white;
      box-sizing: border-box;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      font-size: 12px;
      font-weight: 600;
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(255,153,0,0.3);
    }
    .btn:active {
      transform: scale(0.95);
    }
    .btn img {
      width: 40px;
      height: 40px;
      margin-bottom: 8px;
      object-fit: contain;
    }
    .instagram {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }
    .tiktok {
      background-color: #000000;
      border: 1px solid #444;
    }
    .whatsapp {
      background-color: #25D366;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Resinas DragonBall</h1>
    <p>¡Síguenos en nuestras redes!</p>

    <div class="button-container">
      <a href="https://www.instagram.com/resinasdragonball" class="btn instagram" target="_blank">
        <img src="Instagram.png" alt="Instagram">
        Instagram
      </a>

      <a href="https://www.tiktok.com/@resinasdragonball" class="btn tiktok" target="_blank">
        <img src="TikTok.png" alt="TikTok">
        TikTok
      </a>

      <!-- Recuerda cambiar el número de teléfono con prefijo de país -->
      <a href="https://wa.me/34000000000" class="btn whatsapp" target="_blank">
        <img src="WhatsApp.png" alt="WhatsApp">
        WhatsApp
      </a>
    </div>
  </div>
</body>
</html>
